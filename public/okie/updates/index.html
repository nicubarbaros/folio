<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Okie updates</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #171717;
        color: #dfd3c3;
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      main {
        width: min(36rem, calc(100% - 3rem));
      }
      h1 {
        margin: 0 0 0.75rem;
        color: #fff;
        font-size: 1.5rem;
        font-weight: 560;
      }
      p {
        margin: 0 0 1rem;
      }
      a {
        color: #8ea2ff;
      }
      code {
        font-family: ui-monospace, monospace;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Okie updates</h1>
      <p>Okie checks this address when it opens.</p>
      <p>
        The version it compares against is in
        <a href="/okie/updates/latest-mac.yml"><code>latest-mac.yml</code></a>. A newer Mac build goes in
        this same folder.
      </p>
      <p><a href="/okie">Okie</a></p>
    </main>
  </body>
</html>
